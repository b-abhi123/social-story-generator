<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StoryPath — AI Social Story Generator</title>
  <meta name="description" content="Generate personalized social stories for children with autism using AI." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Caveat:wght@600;700&display=swap" rel="stylesheet" />
  <style>
    /* ── Reset & Tokens ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-primary: #0f0f1a;
      --bg-secondary: #161625;
      --bg-card: rgba(255, 255, 255, 0.04);
      --bg-card-hover: rgba(255, 255, 255, 0.07);
      --bg-glass: rgba(255, 255, 255, 0.06);
      --border: rgba(255, 255, 255, 0.08);
      --border-focus: rgba(139, 92, 246, 0.5);
      --text-primary: #f0f0f5;
      --text-secondary: #a0a0b8;
      --text-muted: #6b6b80;
      --accent-purple: #8b5cf6;
      --accent-pink: #ec4899;
      --accent-blue: #3b82f6;
      --accent-teal: #14b8a6;
      --accent-orange: #f59e0b;
      --gradient-hero: linear-gradient(135deg, #8b5cf6 0%, #ec4899 50%, #f59e0b 100%);
      --gradient-btn: linear-gradient(135deg, #8b5cf6 0%, #7c3aed 100%);
      --gradient-btn-hover: linear-gradient(135deg, #9d6ffd 0%, #8b5cf6 100%);
      --shadow-lg: 0 20px 60px rgba(0, 0, 0, 0.4);
      --shadow-glow: 0 0 40px rgba(139, 92, 246, 0.15);
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-xl: 24px;
      --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);

      /* Flipbook tokens */
      --book-bg: #fdf6ec;
      --book-border: #e8dcc8;
      --book-shadow: 0 12px 48px rgba(0, 0, 0, 0.35), 0 2px 8px rgba(0,0,0,0.15);
      --book-caption-color: #3d3529;
      --book-counter-color: #9a8e7d;
      --dot-inactive: rgba(255,255,255,0.2);
      --dot-active: #f59e0b;
      --nav-btn-bg: rgba(255,255,255,0.08);
      --nav-btn-bg-hover: rgba(255,255,255,0.14);
      --nav-btn-disabled: rgba(255,255,255,0.03);
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      line-height: 1.6;
      overflow-x: hidden;
    }

    /* ── Ambient Background ── */
    .ambient-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
    }
    .ambient-bg .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(100px);
      opacity: 0.15;
      animation: float 20s ease-in-out infinite;
    }
    .ambient-bg .orb:nth-child(1) {
      width: 500px; height: 500px;
      background: var(--accent-purple);
      top: -10%; left: -5%;
      animation-delay: 0s;
    }
    .ambient-bg .orb:nth-child(2) {
      width: 400px; height: 400px;
      background: var(--accent-pink);
      bottom: -10%; right: -5%;
      animation-delay: -7s;
    }
    .ambient-bg .orb:nth-child(3) {
      width: 300px; height: 300px;
      background: var(--accent-teal);
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      animation-delay: -14s;
    }
    @keyframes float {
      0%, 100% { transform: translate(0, 0) scale(1); }
      33% { transform: translate(30px, -40px) scale(1.05); }
      66% { transform: translate(-20px, 30px) scale(0.95); }
    }

    /* ── Layout ── */
    .container {
      position: relative;
      z-index: 1;
      max-width: 900px;
      margin: 0 auto;
      padding: 40px 24px 80px;
    }

    /* ── Header ── */
    .header {
      text-align: center;
      margin-bottom: 48px;
    }
    .header .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 16px;
      border-radius: 100px;
      background: var(--bg-glass);
      border: 1px solid var(--border);
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--text-secondary);
      margin-bottom: 20px;
      backdrop-filter: blur(12px);
    }
    .header .badge .dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--accent-teal);
      animation: pulse-dot 2s ease-in-out infinite;
    }
    @keyframes pulse-dot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.8); }
    }
    .header h1 {
      font-size: clamp(2.2rem, 5vw, 3.2rem);
      font-weight: 800;
      background: var(--gradient-hero);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -0.02em;
      line-height: 1.15;
      margin-bottom: 12px;
    }
    .header p {
      font-size: 1.05rem;
      color: var(--text-secondary);
      max-width: 520px;
      margin: 0 auto;
    }

    /* ── Glass Card (Form) ── */
    .glass-card {
      background: var(--bg-glass);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      padding: 36px;
      backdrop-filter: blur(20px);
      box-shadow: var(--shadow-lg);
    }

    /* ── Form ── */
    .form-section-title {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      margin-bottom: 16px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 28px;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .form-group.full-width {
      grid-column: 1 / -1;
    }
    .form-group label {
      font-size: 0.82rem;
      font-weight: 500;
      color: var(--text-secondary);
    }
    .form-group input,
    .form-group textarea,
    .form-group select {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 11px 14px;
      font-size: 0.92rem;
      color: var(--text-primary);
      font-family: inherit;
      transition: border-color var(--transition), box-shadow var(--transition);
      outline: none;
    }
    .form-group input::placeholder,
    .form-group textarea::placeholder {
      color: var(--text-muted);
    }
    .form-group input:focus,
    .form-group textarea:focus,
    .form-group select:focus {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.12);
    }
    .form-group textarea {
      resize: vertical;
      min-height: 80px;
    }
    .form-group select option {
      background: var(--bg-secondary);
    }

    /* ── Submit Button ── */
    .submit-btn {
      width: 100%;
      padding: 15px 24px;
      border: none;
      border-radius: var(--radius-md);
      background: var(--gradient-btn);
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: all var(--transition);
      position: relative;
      overflow: hidden;
    }
    .submit-btn:hover:not(:disabled) {
      background: var(--gradient-btn-hover);
      transform: translateY(-1px);
      box-shadow: 0 8px 30px rgba(139, 92, 246, 0.3);
    }
    .submit-btn:active:not(:disabled) {
      transform: translateY(0);
    }
    .submit-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .submit-btn .btn-content {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    /* ── Spinner ── */
    .spinner {
      width: 20px; height: 20px;
      border: 2.5px solid rgba(255,255,255,0.25);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: inline-block;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Progress / Status ── */
    .status-bar {
      margin-top: 28px;
      text-align: center;
      display: none;
    }
    .status-bar.active { display: block; }
    .status-bar .status-text {
      font-size: 0.9rem;
      color: var(--text-secondary);
      margin-bottom: 12px;
    }
    .progress-track {
      height: 4px;
      border-radius: 100px;
      background: rgba(255,255,255,0.06);
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      border-radius: 100px;
      background: var(--gradient-hero);
      width: 0%;
      transition: width 0.5s ease;
    }

    /* ── Error ── */
    .error-banner {
      margin-top: 20px;
      padding: 14px 18px;
      border-radius: var(--radius-md);
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.25);
      color: #fca5a5;
      font-size: 0.88rem;
      display: none;
    }
    .error-banner.active { display: block; }

    /* ── Footer ── */
    .footer {
      text-align: center;
      margin-top: 60px;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    /* ══════════════════════════════════════════
       FLIPBOOK OVERLAY
       ══════════════════════════════════════════ */
    .flipbook-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: rgba(8, 8, 18, 0.92);
      backdrop-filter: blur(16px);
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      animation: overlayFadeIn 0.4s ease;
    }
    .flipbook-overlay.active {
      display: flex;
    }
    @keyframes overlayFadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    /* Close button */
    .flipbook-close {
      position: absolute;
      top: 20px;
      right: 24px;
      width: 40px; height: 40px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--nav-btn-bg);
      color: var(--text-secondary);
      font-size: 1.2rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all var(--transition);
    }
    .flipbook-close:hover {
      background: var(--nav-btn-bg-hover);
      color: var(--text-primary);
    }

    /* Story title in flipbook */
    .flipbook-title {
      font-family: 'Caveat', cursive;
      font-size: clamp(1.6rem, 3.5vw, 2.4rem);
      font-weight: 700;
      background: var(--gradient-hero);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 24px;
      text-align: center;
      flex-shrink: 0;
    }

    /* ── Panel Card (the "page") ── */
    .flipbook-card-wrapper {
      position: relative;
      width: 100%;
      max-width: 440px;
      flex-shrink: 1;
      min-height: 0;
      /* This wrapper holds the animating card */
    }
    .flipbook-card {
      background: var(--book-bg);
      border: 1px solid var(--book-border);
      border-radius: 20px;
      box-shadow: var(--book-shadow);
      overflow: hidden;
      transition: opacity 0.35s ease, transform 0.35s ease;
      will-change: opacity, transform;
    }
    .flipbook-card.fade-out {
      opacity: 0;
      transform: translateY(12px);
    }
    .flipbook-card.fade-in {
      opacity: 1;
      transform: translateY(0);
    }
    .flipbook-card-image {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      display: block;
      background: #efe8da;
    }
    .flipbook-card-caption {
      padding: 22px 28px;
      font-size: 1.05rem;
      line-height: 1.65;
      color: var(--book-caption-color);
      text-align: center;
      font-weight: 500;
    }

    /* Section chip — small pill showing "Introduction / Body / Conclusion" */
    .flipbook-section-chip {
      position: absolute;
      top: 14px;
      left: 14px;
      padding: 4px 14px;
      border-radius: 100px;
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(8px);
      font-size: 0.68rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #fff;
    }
    /* Panel number badge */
    .flipbook-panel-number {
      position: absolute;
      top: 14px;
      right: 14px;
      width: 30px; height: 30px;
      border-radius: 50%;
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.78rem;
      font-weight: 700;
      color: #fff;
    }

    /* ── Navigation Row ── */
    .flipbook-nav {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-top: 24px;
      flex-shrink: 0;
    }
    .flipbook-arrow {
      width: 48px; height: 48px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--nav-btn-bg);
      color: var(--text-primary);
      font-size: 1.15rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all var(--transition);
      flex-shrink: 0;
    }
    .flipbook-arrow:hover:not(:disabled) {
      background: var(--nav-btn-bg-hover);
      transform: scale(1.08);
    }
    .flipbook-arrow:active:not(:disabled) {
      transform: scale(0.96);
    }
    .flipbook-arrow:disabled {
      background: var(--nav-btn-disabled);
      color: var(--text-muted);
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* Dots */
    .flipbook-dots {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .flipbook-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      background: var(--dot-inactive);
      transition: all 0.3s ease;
    }
    .flipbook-dot.active {
      background: var(--dot-active);
      transform: scale(1.3);
      box-shadow: 0 0 10px rgba(245, 158, 11, 0.45);
    }

    /* Counter */
    .flipbook-counter {
      margin-top: 14px;
      font-size: 0.82rem;
      color: var(--text-muted);
      text-align: center;
      flex-shrink: 0;
    }

    /* Action buttons (Print / PDF) */
    .flipbook-actions {
      display: flex;
      gap: 12px;
      margin-top: 12px;
      flex-shrink: 0;
    }
    .flipbook-action-btn {
      padding: 10px 24px;
      border-radius: 100px;
      border: 1px solid var(--border);
      background: var(--nav-btn-bg);
      color: var(--text-secondary);
      font-size: 0.82rem;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      transition: all var(--transition);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .flipbook-action-btn:hover {
      background: var(--nav-btn-bg-hover);
      color: var(--text-primary);
    }
    .flipbook-action-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* ── Print Styles ── */
    @media print {
      /* Hide everything except the flipbook card */
      body * { visibility: hidden; }
      .flipbook-overlay,
      .flipbook-overlay .flipbook-title,
      .flipbook-overlay .flipbook-card-wrapper,
      .flipbook-overlay .flipbook-card,
      .flipbook-overlay .flipbook-card * {
        visibility: visible;
      }
      .flipbook-overlay {
        position: static;
        background: #fff;
        backdrop-filter: none;
      }
      .flipbook-close,
      .flipbook-nav,
      .flipbook-counter,
      .flipbook-actions { display: none !important; }
      .flipbook-card {
        box-shadow: none;
        border: 1px solid #ddd;
        max-width: 500px;
        margin: 0 auto;
      }
    }

    /* ── Responsive ── */
    @media (max-width: 600px) {
      .container { padding: 24px 16px 60px; }
      .glass-card { padding: 24px 20px; }
      .form-grid { grid-template-columns: 1fr; }
      .flipbook-card-wrapper { max-width: 100%; }
      .flipbook-card-caption { padding: 16px 20px; font-size: 0.95rem; }
      .flipbook-arrow { width: 42px; height: 42px; font-size: 1rem; }
      .flipbook-nav { gap: 14px; }
    }
  </style>
</head>
<body>

  <!-- Ambient floating orbs -->
  <div class="ambient-bg">
    <div class="orb"></div>
    <div class="orb"></div>
    <div class="orb"></div>
  </div>

  <div class="container">
    <!-- ── Header ── -->
    <header class="header">
      <div class="badge"><span class="dot"></span> AI-Powered Social Stories</div>
      <h1>StoryPath</h1>
      <p>Create personalized, illustrated social stories for children with autism — powered by AI.</p>
    </header>

    <!-- ── Form ── -->
    <form id="storyForm" class="glass-card" autocomplete="off">

      <div class="form-section-title">Child's Profile</div>
      <div class="form-grid">
        <div class="form-group">
          <label for="childName">Name</label>
          <input type="text" id="childName" placeholder="e.g. Arjun" value="Arjun" required />
        </div>
        <div class="form-group">
          <label for="age">Age</label>
          <input type="text" id="age" placeholder="e.g. 6" value="6" required />
        </div>
        <div class="form-group">
          <label for="gender">Gender</label>
          <select id="gender" required>
            <option value="boy">Boy</option>
            <option value="girl">Girl</option>
          </select>
        </div>
        <div class="form-group">
          <label for="interests">Interests / Comfort Objects</label>
          <input type="text" id="interests" placeholder="e.g. dinosaurs, the color blue" value="dinosaurs, the color blue" />
        </div>
      </div>

      <div class="form-section-title">Appearance</div>
      <div class="form-grid">
        <div class="form-group">
          <label for="skinTone">Skin Tone</label>
          <input type="text" id="skinTone" placeholder="e.g. warm medium-brown" value="warm medium-brown" />
        </div>
        <div class="form-group">
          <label for="hair">Hair</label>
          <input type="text" id="hair" placeholder="e.g. short black curly hair" value="short black curly hair" />
        </div>
        <div class="form-group full-width">
          <label for="outfit">Outfit</label>
          <input type="text" id="outfit" placeholder="e.g. a simple blue t-shirt and grey pants" value="a simple blue t-shirt and grey pants" />
        </div>
        <div class="form-group">
          <label for="colorPalette">Color Palette</label>
          <select id="colorPalette">
            <option value="warm pastel">Warm Pastel</option>
            <option value="cool pastel">Cool Pastel</option>
            <option value="bright and cheerful">Bright &amp; Cheerful</option>
            <option value="soft earthy tones">Soft Earthy</option>
            <option value="muted rainbow">Muted Rainbow</option>
          </select>
        </div>
      </div>

      <div class="form-section-title">Situation</div>
      <div class="form-grid">
        <div class="form-group full-width">
          <label for="situation">Describe the situation</label>
          <textarea id="situation" placeholder="e.g. Arjun has a dentist appointment after school" required>Arjun has a dentist appointment after school</textarea>
        </div>
      </div>

      <button type="submit" class="submit-btn" id="submitBtn">
        <span class="btn-content">
          <span id="btnText">✨ Generate Story</span>
        </span>
      </button>

      <!-- Status bar shown during generation -->
      <div class="status-bar" id="statusBar">
        <div class="status-text" id="statusText">Generating story…</div>
        <div class="progress-track">
          <div class="progress-fill" id="progressFill"></div>
        </div>
      </div>

      <!-- Error banner -->
      <div class="error-banner" id="errorBanner"></div>
    </form>

    <footer class="footer">StoryPath &mdash; built with care for every child 💜</footer>
  </div>

  <!-- ══════════════════════════════════════════
       FLIPBOOK FULLSCREEN OVERLAY
       ══════════════════════════════════════════ -->
  <div class="flipbook-overlay" id="flipbookOverlay">
    <button class="flipbook-close" id="flipbookClose" aria-label="Close story viewer">✕</button>

    <h2 class="flipbook-title" id="flipbookTitle"></h2>

    <div class="flipbook-card-wrapper">
      <div class="flipbook-card fade-in" id="flipbookCard">
        <span class="flipbook-section-chip" id="flipbookSectionChip"></span>
        <span class="flipbook-panel-number" id="flipbookPanelNumber"></span>
        <img class="flipbook-card-image" id="flipbookImage" src="" alt="Story panel illustration" />
        <div class="flipbook-card-caption" id="flipbookCaption"></div>
      </div>
    </div>

    <div class="flipbook-nav">
      <button class="flipbook-arrow" id="prevBtn" aria-label="Previous panel">◀</button>
      <div class="flipbook-dots" id="flipbookDots"></div>
      <button class="flipbook-arrow" id="nextBtn" aria-label="Next panel">▶</button>
    </div>

    <div class="flipbook-counter" id="flipbookCounter"></div>

    <div class="flipbook-actions">
      <button class="flipbook-action-btn" id="flipbookPdf">
        📄 Download PDF
      </button>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script>
    /* ── DOM refs ── */
    const form = document.getElementById('storyForm');
    const submitBtn = document.getElementById('submitBtn');
    const btnText = document.getElementById('btnText');
    const statusBar = document.getElementById('statusBar');
    const statusText = document.getElementById('statusText');
    const progressFill = document.getElementById('progressFill');
    const errorBanner = document.getElementById('errorBanner');

    /* Flipbook refs */
    const flipbookOverlay = document.getElementById('flipbookOverlay');
    const flipbookClose = document.getElementById('flipbookClose');
    const flipbookTitle = document.getElementById('flipbookTitle');
    const flipbookCard = document.getElementById('flipbookCard');
    const flipbookImage = document.getElementById('flipbookImage');
    const flipbookCaption = document.getElementById('flipbookCaption');
    const flipbookSectionChip = document.getElementById('flipbookSectionChip');
    const flipbookPanelNumber = document.getElementById('flipbookPanelNumber');
    const flipbookDots = document.getElementById('flipbookDots');
    const flipbookCounter = document.getElementById('flipbookCounter');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const flipbookPdf = document.getElementById('flipbookPdf');

    /* ── State ── */
    let storyData = null;   // { title, panels: [{caption, image}] }
    let currentIdx = 0;
    const SECTION_NAMES = ['Introduction', 'Introduction', 'Body', 'Body', 'Conclusion', 'Conclusion'];

    /* Simulated progress steps */
    const PROGRESS_STEPS = [
      { pct: 10, msg: 'Crafting the storyline…' },
      { pct: 25, msg: 'Writing panels with care…' },
      { pct: 40, msg: 'Story ready — generating illustrations…' },
      { pct: 55, msg: 'Drawing panel 1 & 2…' },
      { pct: 65, msg: 'Drawing panel 3 & 4…' },
      { pct: 78, msg: 'Drawing panel 5 & 6…' },
      { pct: 88, msg: 'Finishing touches…' },
    ];

    /* ── Flipbook Logic ── */

    function openFlipbook(data) {
      storyData = data;
      currentIdx = 0;
      flipbookTitle.textContent = data.title;

      // Build dots
      flipbookDots.innerHTML = '';
      data.panels.forEach((_, i) => {
        const dot = document.createElement('span');
        dot.className = 'flipbook-dot' + (i === 0 ? ' active' : '');
        dot.dataset.index = i;
        dot.addEventListener('click', () => goToPanel(i));
        dot.style.cursor = 'pointer';
        flipbookDots.appendChild(dot);
      });

      renderPanel(0, false);
      flipbookOverlay.classList.add('active');
      document.body.style.overflow = 'hidden'; // prevent page scroll
    }

    function closeFlipbook() {
      flipbookOverlay.classList.remove('active');
      document.body.style.overflow = '';
    }

    function renderPanel(idx, animate = true) {
      const panel = storyData.panels[idx];
      const total = storyData.panels.length;

      if (animate) {
        // Fade out, swap content, then fade in
        flipbookCard.classList.remove('fade-in');
        flipbookCard.classList.add('fade-out');
        setTimeout(() => {
          setCardContent(panel, idx, total);
          flipbookCard.classList.remove('fade-out');
          flipbookCard.classList.add('fade-in');
        }, 200); // matches half the CSS transition duration
      } else {
        setCardContent(panel, idx, total);
        flipbookCard.classList.remove('fade-out');
        flipbookCard.classList.add('fade-in');
      }

      // Update dots
      flipbookDots.querySelectorAll('.flipbook-dot').forEach((d, i) => {
        d.classList.toggle('active', i === idx);
      });

      // Update counter
      flipbookCounter.textContent = `${idx + 1} of ${total}`;

      // Update arrows
      prevBtn.disabled = idx === 0;
      nextBtn.disabled = idx === total - 1;
    }

    function setCardContent(panel, idx, total) {
      flipbookImage.src = panel.image;
      flipbookImage.alt = `Panel ${idx + 1} illustration`;
      flipbookCaption.textContent = panel.caption;
      flipbookSectionChip.textContent = SECTION_NAMES[idx] || '';
      flipbookPanelNumber.textContent = idx + 1;
    }

    function goToPanel(idx) {
      if (idx < 0 || idx >= storyData.panels.length || idx === currentIdx) return;
      currentIdx = idx;
      renderPanel(idx);
    }

    /* Navigation */
    prevBtn.addEventListener('click', () => goToPanel(currentIdx - 1));
    nextBtn.addEventListener('click', () => goToPanel(currentIdx + 1));
    flipbookClose.addEventListener('click', closeFlipbook);

    /* PDF Generation */
    flipbookPdf.addEventListener('click', async () => {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'letter' });
      const pageWidth = doc.internal.pageSize.getWidth();
      const pageHeight = doc.internal.pageSize.getHeight();
      
      const originalText = flipbookPdf.innerHTML;
      flipbookPdf.innerHTML = '<span class="spinner" style="width:14px;height:14px;border-width:2px;margin-right:6px;vertical-align:middle;"></span> Generating PDF...';
      flipbookPdf.disabled = true;

      // Small delay to allow the UI to update the button text before blocking the main thread
      setTimeout(() => {
        try {
          for (let i = 0; i < storyData.panels.length; i++) {
            if (i > 0) doc.addPage();
            const panel = storyData.panels[i];
            
            // Image centered, roughly square ~160mm width
            const imgSize = 160;
            const imgX = (pageWidth - imgSize) / 2;
            const imgY = 25;
            
            doc.addImage(panel.image, 'PNG', imgX, imgY, imgSize, imgSize);
            
            // Caption text centered below image
            const textY = imgY + imgSize + 25;
            doc.setFont('helvetica', 'normal');
            doc.setFontSize(20);
            
            const maxTextWidth = pageWidth - 40; 
            const lines = doc.splitTextToSize(panel.caption, maxTextWidth);
            doc.text(lines, pageWidth / 2, textY, { align: 'center' });
            
            // Page fraction at bottom
            doc.setFontSize(10);
            doc.setTextColor(160, 160, 160);
            doc.text(`${i + 1} of ${storyData.panels.length}`, pageWidth / 2, pageHeight - 15, { align: 'center' });
            doc.setTextColor(0, 0, 0); // reset
          }
          
          // Use safe title for filename
          const safeTitle = storyData.title.replace(/[^a-z0-9]/gi, '_').toLowerCase();
          doc.save(`${safeTitle}.pdf`);
        } catch (e) {
          console.error("PDF generation failed:", e);
          alert("Sorry, an error occurred while creating the PDF.");
        } finally {
          flipbookPdf.innerHTML = originalText;
          flipbookPdf.disabled = false;
        }
      }, 50);
    });

    /* Keyboard navigation */
    document.addEventListener('keydown', (e) => {
      if (!flipbookOverlay.classList.contains('active')) return;
      if (e.key === 'ArrowLeft') goToPanel(currentIdx - 1);
      else if (e.key === 'ArrowRight') goToPanel(currentIdx + 1);
      else if (e.key === 'Escape') closeFlipbook();
    });

    /* ── Form Submission ── */
    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      // Reset UI
      errorBanner.classList.remove('active');
      submitBtn.disabled = true;
      btnText.innerHTML = '<span class="spinner"></span> Generating…';
      statusBar.classList.add('active');
      progressFill.style.width = '0%';

      // Start fake progress
      let stepIdx = 0;
      const progressInterval = setInterval(() => {
        if (stepIdx < PROGRESS_STEPS.length) {
          const step = PROGRESS_STEPS[stepIdx];
          progressFill.style.width = step.pct + '%';
          statusText.textContent = step.msg;
          stepIdx++;
        }
      }, 8000);

      const payload = {
        childName: document.getElementById('childName').value,
        age: document.getElementById('age').value,
        gender: document.getElementById('gender').value,
        interests: document.getElementById('interests').value,
        skinTone: document.getElementById('skinTone').value,
        hair: document.getElementById('hair').value,
        outfit: document.getElementById('outfit').value,
        colorPalette: document.getElementById('colorPalette').value,
        situation: document.getElementById('situation').value,
      };

      try {
        const res = await fetch('/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });

        clearInterval(progressInterval);
        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.error || 'Server returned an error.');
        }

        progressFill.style.width = '100%';
        statusText.textContent = 'Done!';

        // Open the flipbook overlay
        setTimeout(() => openFlipbook(data), 400);

      } catch (err) {
        clearInterval(progressInterval);
        errorBanner.textContent = '⚠ ' + err.message;
        errorBanner.classList.add('active');
      } finally {
        submitBtn.disabled = false;
        btnText.textContent = '✨ Generate Story';
        setTimeout(() => statusBar.classList.remove('active'), 2000);
      }
    });
  </script>
</body>
</html>
